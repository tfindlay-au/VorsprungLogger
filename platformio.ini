; VorsprungLogger — Audi-focused vehicle telemetry logger
; PlatformIO project configuration for Freematics ONE+ Model B (ESP32).
;
; Build:  pio run -e esp32dev
; Upload: pio run -e esp32dev -t upload
;
; PlatformIO docs: http://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
;build_flags = -DBOARD_HAS_PSRAM
board=esp-wrover-kit
board_build.f_cpu = 160000000L
framework = arduino
; 38400: UART0 is shared (console transmit + external GNSS receive) and the
; GNSS module talks 38400. Keep in lockstep with Serial.begin() in main.cpp.
monitor_speed = 38400
board_build.flash_mode = qio
board_build.partitions = huge_app.csv

;[env:esp32c3]
;platform = espressif32
;framework = arduino
;board = esp32-c3-devkitm-1
;board_build.mcu = esp32c3
;monitor_speed=115200
;board_build.partitions = huge_app.csv

[platformio]
src_dir=src

[env]
lib_extra_dirs=libraries
lib_ignore=TinyGPS
